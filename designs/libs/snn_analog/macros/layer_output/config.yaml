meta:
  version: 3
  flow: Classic

DESIGN_NAME: layer_output

# --- RTL del top: instancia las 2 neuronas (x1, x2) ---
VERILOG_FILES:
  - dir::layer_output.v

# --- Floorplaning ---
FP_SIZING: absolute
DIE_AREA:
  - 0
  - 0
  - 130 #140
  - 50

# --- Alimentación y Potencia ---
VDD_NETS:
  - vdd
GND_NETS:
  - vss

#FP_PIN_ORDER_CFG: dir::pin.cfg
IO_PIN_ORDER_CFG: dir::pin.cfg


PDN_VERTICAL_LAYER: met3
PDN_HORIZONTAL_LAYER: met4


PDN_ENABLE_RAILS: false
PDN_MULTILAYER: true
PDN_VWIDTH: 1.6
PDN_HWIDTH: 1.6
PDN_VSPACING: 2
PDN_HSPACING: 2

PDN_VPITCH: 20 #65
PDN_HPITCH: 60 #50

PDN_VOFFSET: 22.0 #10
PDN_HOFFSET: 10.0 #35

PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 1.6
PDN_CORE_RING_HWIDTH: 1.6
PDN_CORE_RING_VSPACING: 1.6
PDN_CORE_RING_HSPACING: 1.6


# --- Conexiones de Potencia para los Macros ---
PDN_MACRO_CONNECTIONS:
  - "x1 vdd vss vdd vss"
  - "x2 vdd vss vdd vss"

#A evaluar 
PL_TIMING_DRIVEN: false            # Disables OpenROAD timing-driven placement
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_REPAIR_DESIGN: false
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_HEURISTIC_DIODE_INSERTION: false
RUN_FILL_INSERTION: false
RUN_TAP_ENDCAP_INSERTION: false
ERROR_ON_PDN_VIOLATIONS: false

# --- Direct LEF/GDS Blackbox Include ---
EXTRA_LEFS:
  - /foss/designs/libs/snn_analog/lif/lef/neurona.lef
EXTRA_GDS:
  - /foss/designs/libs/snn_analog/lif/gds/neurona.gds

# --- Reglas de Enrutamiento y Capas (GF180MCU) ---
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
MAGIC_ZEROIZE_ORIGIN: false
ERROR_ON_MAGIC_DRC: false
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
MAGIC_EXT_UNIQUE: notopports

RT_MIN_LAYER: met2
RT_MAX_LAYER: met4
DRT_THREADS: 12
GRT_ALLOW_CONGESTION: true

NON_DEFAULT_RULES:
  ndr_safe_spacing:
    width:
      - met3
      - "0.3"
    spacing:
      - met3
      - "1.1"

DRT_ASSIGN_NDR:
  ".*": ndr_safe_spacing

# metal para los pines
IO_PIN_H_LAYER: met2
IO_PIN_V_LAYER: met2

IO_PIN_H_LENGTH: 3
IO_PIN_V_LENGTH: 1.5
IO_PIN_V_THICKNESS_MULT: 3
IO_PIN_H_THICKNESS_MULT: 10


MACROS:
  neurona:

    gds:
      - /foss/designs/libs/snn_analog/lif/gds/neurona.gds
    lef:
      - /foss/designs/libs/snn_analog/lif/lef/neurona.lef
    spice:
      - /foss/designs/libs/snn_analog/lif/spice/neurona.spice
    vh:
      - /foss/designs/libs/snn_analog/lif/verilog/neurona.v
    lib:
      "*":
        - /foss/designs/libs/snn_analog/lif/lib/neurona.lib
    instances:

      x1:
        location: [10, 10]
        orientation: N
      x2:
        location: [65, 10]
        orientation: N