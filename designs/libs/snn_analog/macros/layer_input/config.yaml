meta:
  version: 3
  flow: Classic

DESIGN_NAME: layer_input

VERILOG_FILES:
  - dir::layer_input.v

FP_PIN_ORDER_CFG: dir::pin.cfg

# --- Floorplanning ---
FP_SIZING: absolute 
DIE_AREA:
  - 0
  - 0
  - 70 #100
  - 180 #200

# --- Power Grid (PDN) ---
VDD_NETS:
  - vdd
GND_NETS:
  - vss

PAD_LIBS: {} #para ignorar los pads de la librería de pads del PDK y usar los pads de la macro, se necesita ignoras las librerias de 5V0
# IO_PIN_ORDER_CFG: dir::pin.cfg
# --- Power Grid (PDN) ajustado a Met3 / Met4 ---
PDN_VERTICAL_LAYER: met3
PDN_HORIZONTAL_LAYER: met4

PDN_ENABLE_RAILS: false
PDN_MULTILAYER: true
PDN_VWIDTH: 1.6
PDN_HWIDTH: 1.6
PDN_VSPACING: 2
PDN_HSPACING: 2
PDN_VPITCH: 40
PDN_HPITCH: 40
PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 1.6
PDN_CORE_RING_HWIDTH: 1.6
PDN_CORE_RING_VSPACING: 1.6
PDN_CORE_RING_HSPACING: 1.6
PDN_VOFFSET: 30.0 #25
PDN_HOFFSET: 10.0

# Connect Macro Power/Ground Pins to Global Net
PDN_MACRO_CONNECTIONS:
  - "x1 vdd vss vdd vss"
  - "x2 vdd vss vdd vss"
  - "x3 vdd vss vdd vss"
  - "x4 vdd vss vdd vss"

# --- Blackbox & Analog Optimization (Valid LibreLane Flags) ---
PL_TIMING_DRIVEN: false            # Disables OpenROAD timing-driven placement
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_REPAIR_DESIGN: false
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_HEURISTIC_DIODE_INSERTION: false
RUN_FILL_INSERTION: false
RUN_TAP_ENDCAP_INSERTION: false
ERROR_ON_PDN_VIOLATIONS: false
GRT_MACRO_EXTENSION: 0.2


# --- Direct LEF/GDS Blackbox Include ---
EXTRA_LEFS:
  - /foss/designs/libs/snn_analog/lif/lef/neurona.lef
EXTRA_GDS: 
  - /foss/designs/libs/snn_analog/lif/gds/neurona.gds

# --- Routing (GF180MCU) ---
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
MAGIC_ZEROIZE_ORIGIN: false
ERROR_ON_MAGIC_DRC: false
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
MAGIC_EXT_UNIQUE: notopports

RT_MIN_LAYER: met2
RT_MAX_LAYER: met4
ROUTING_CORES: 12
GRT_ALLOW_CONGESTION: true

IO_PIN_H_LAYER: met2
IO_PIN_V_LAYER: met2

IO_PIN_H_LENGTH: 2.5
IO_PIN_V_LENGTH: 2.5
IO_PIN_V_THICKNESS_MULT: 3
IO_PIN_H_THICKNESS_MULT: 3

NON_DEFAULT_RULES:
  ndr_safe_spacing:
    width:
      - met3
      - "0.3"
    spacing:
      - met3
      - "1.1"

DRT_ASSIGN_NDR:
  ".*": ndr_safe_spacing

# --- Analog Macro Instantiation ---
MACROS:
  neurona:

    gds:
      - /foss/designs/libs/snn_analog/lif/gds/neurona.gds
    lef:
      - /foss/designs/libs/snn_analog/lif/lef/neurona.lef
    spice:
      - /foss/designs/libs/snn_analog/lif/spice/neurona.spice
    vh:
      - /foss/designs/libs/snn_analog/lif/verilog/neurona.v
    lib:
      "*":
        - /foss/designs/libs/snn_analog/lif/lib/neurona.lib
    instances:
      x4:
        location: [10, 10] #30
        orientation: N
      x3:
        location: [10, 50] #130
        orientation: N
      x2:
        location: [10, 90] #230
        orientation: N
      x1:
        location: [10, 130] #330
        orientation: N